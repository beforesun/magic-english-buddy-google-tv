name: Build Google TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle web application
        run: |
          mkdir -p android-tv/app/src/main/assets
          cp -R dist/. android-tv/app/src/main/assets/
      - name: Build sideload APK
        working-directory: android-tv
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: magic-english-buddy-google-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
